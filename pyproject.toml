[project]
name = "fastapi-course"
version = "0.1.0"
description = "FastAPI course project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastapi-cli>=0.0.32",
    "sqlmodel>=0.0.47",
    "alembic>=1.20.0",
    "pydantic-settings>=2.15.0",
    "PyJWT>=2.15.0",
    "pwdlib[argon2]>=0.3.1",
    "cryptography>=42.0.5",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
