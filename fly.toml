# fly.toml app configuration file generated for fastapi-course-example on 2026-06-25T15:55:58+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fastapi-course-example'
primary_region = 'fra'

[build]

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '1gb'
cpus = 1
memory_mb = 1024

[mounts]
source = "fastapi_course_example_data"
destination = "/data"

[env]
DATABASE_URL = "sqlite:////data/database.sqlite3"
ACCESS_TOKEN_EXPIRE_MINUTES = "60"

